[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adcheck"
version = "0.1.0"
description = "Leverage and k-nearest-neighbour applicability domain checking for trained models"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Prasanta Bandyopadhyay", email = "prasanta13@users.noreply.github.com" },
]
keywords = [
    "applicability domain",
    "machine learning",
    "model validation",
    "leverage",
    "QSAR",
    "out-of-distribution",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
]

[project.urls]
Homepage = "https://github.com/prasanta13/adcheck"
Repository = "https://github.com/prasanta13/adcheck"
Issues = "https://github.com/prasanta13/adcheck/issues"
Changelog = "https://github.com/prasanta13/adcheck/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/adcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
